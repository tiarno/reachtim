title: Curtains
slug: curtains
dir: curtains
mount: 4 / 3
lane: art
order: 1
summary: >-
  These are generated — a few hundred near-vertical strands per sheet, all
  sharing one smooth displacement field. That shared field is the whole trick:
  neighbouring strands move together, so it reads as cloth instead of noise. The
  dark creases aren't drawn anywhere. They're just where the field compresses
  hard enough that strands pile up and the ink stacks. Colour is assigned by
  where a strand starts, so it travels with the fold rather than sitting still on
  the page.

# The style is a digital take on the "Ribbons" plotter art that turns up on
# r/PlotterArt. The generator lives in ~/work/ribbons (ribbons.py): SVG
# polylines under multiply blending, crease darkness computed analytically from
# the horizontal Jacobian rather than left to the blend mode, then rasterized
# through headless Chromium. It took ten versions to stop looking like gauze.
#
# Titles are descriptive labels — the palette of each sheet — not titles Tim
# gave the pieces.
pieces:
  - file: curtain-01-cream-and-rose.jpg
    title: Cream and rose
    alt: >-
      Vertical folds built from thousands of fine parallel curves in cream, tan
      and dusty rose, the strokes crowding to a dark line where each fold turns.
    caption: >-
      The quietest of the four. Warm neutrals, and wide enough passages that you
      can see the paper between the strands doing the shading.

  - file: curtain-02-gold-and-coral.jpg
    title: Gold and coral
    alt: >-
      Folds in gold and coral built from dense parallel curves, with moiré
      patterning where the stroke families cross.
    caption: >-
      Gold against coral. The strands bunch almost to solid along each fold —
      that near-black is stacked ink, not a darker pen. Ochre and brick were
      chosen because they actually collapse toward black when layered; a pure
      yellow never gets past orange no matter how many times you multiply it.

  - file: curtain-03-teal-and-sage.jpg
    title: Teal and sage
    alt: >-
      Folds in teal, sage green and cream, rendered in fine parallel curves that
      widen and narrow to describe the drape.
    caption: >-
      A cooler register, and a good example of stretch: where the field pulls
      strands apart the paper shows through and you get a highlight for free.

  - file: curtain-04-lilac-and-blue.jpg
    title: Lilac and blue
    alt: >-
      Narrow vertical folds in lilac, pink, cream and pale blue, built from
      closely spaced parallel curves.
    caption: >-
      The most crowded of the set — more fold events across the same width, so it
      reads as pleating rather than drape.
