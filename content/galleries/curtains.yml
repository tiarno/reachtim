title: Curtains
slug: curtains
dir: curtains
mount: 4 / 3
lane: art
order: 1
summary: >-
  Thousands of fine parallel curves on a cream ground. There is no fill and no
  shading anywhere in these — every fold, every shadow and the whole sense of
  weight comes from the strokes crowding together or opening out. Where two
  families of curves cross, the interference between them does the rest.

# NOTE: the titles are descriptive labels — the palette of each sheet — not
# titles Tim gave the pieces.
#
# The medium is deliberately not stated. The line work is far too regular to be
# hand-ruled; it is either plotter output or rendered. Confirm with Tim and put
# the real medium (and dates, and dimensions) in the captions.
pieces:
  - file: curtain-01-cream-and-rose.jpg
    title: Cream and rose
    alt: >-
      Vertical folds built from thousands of fine parallel curves in cream, tan
      and dusty rose, the strokes crowding to a dark line where each fold turns.
    caption: >-
      The quietest of the four. Warm neutrals with a single rose band running
      down the centre fold.

  - file: curtain-02-gold-and-coral.jpg
    title: Gold and coral
    alt: >-
      Folds in gold and coral built from dense parallel curves, with moiré
      patterning where the stroke families cross.
    caption: >-
      Gold against coral, with the strokes bunching almost to solid along the
      fold lines. The faint cross-hatching in the wide passages is interference
      between the two families of curves, not a second colour.

  - file: curtain-03-teal-and-sage.jpg
    title: Teal and sage
    alt: >-
      Folds in teal, sage green and cream, rendered in fine parallel curves that
      widen and narrow to describe the drape.
    caption: >-
      A cooler register. The sage passages read as almost flat until the strokes
      tighten and the fold reappears.

  - file: curtain-04-lilac-and-blue.jpg
    title: Lilac and blue
    alt: >-
      Narrow vertical folds in lilac, pink, cream and pale blue, built from
      closely spaced parallel curves.
    caption: >-
      The most crowded of the set — more folds across the same width, so the
      whole sheet reads as pleating rather than drape.
